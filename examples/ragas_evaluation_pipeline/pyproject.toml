[project]
name = "ragas_evaluation_pipeline"
version = "0.1.0"
description = "Dagster-native RAG quality evaluation example"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
]

[project.optional-dependencies]
ragas = [
    "ragas==0.4.3",
    "datasets>=3.0",
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-community==0.3.31",
    "langchain-openai==0.2.14",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragas_evaluation_pipeline"]

[tool.dagster]
module_name = "ragas_evaluation_pipeline.definitions"
code_location_name = "ragas_evaluation_pipeline"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ragas_evaluation_pipeline"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
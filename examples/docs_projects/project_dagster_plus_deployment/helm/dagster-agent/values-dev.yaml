dagsterCloud:
  deployment: "dev"
  # The chart reads the agent token from this secret. Your organization is
  # determined automatically from the token, so there is no `organization` value.
  agentTokenSecretName: dagster-cloud-agent-token
  branchDeployments: true

# `workspace` configures the pods the agent launches: run pods and code servers.
workspace:
  serverTTL:
    fullDeployments:
      enabled: true
      ttlSeconds: 7200
    branchDeployments:
      ttlSeconds: 7200
  envSecrets:
    - name: dagster-dev-env
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  runK8sConfig:
    podSpecConfig:
      nodeSelector:
        cloud.google.com/gke-nodepool: "dev-pool"

# `dagsterCloudAgent` configures the agent deployment itself.
dagsterCloudAgent:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

serviceAccount:
  create: true
  name: dagster-agent-dev
  annotations: {}

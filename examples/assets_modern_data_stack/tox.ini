[tox]
requires =
    tox-uv>=1.16
skipsdist = true

[testenv]
runner = uv-venv-lock-runner
uv_sync_locked = false
uv_sync_flags = --frozen
download = True
passenv =
    CI_*
    BUILDKITE*
    PYTEST_ADDOPTS
    PYTEST_PLUGINS
dependency_groups =
    dev
allowlist_externals =
  /bin/bash
  uv
# Two factors:
#   - source: overwrite the PyPI dagster libs with the local checkouts.
#   - pypi: leave them as installed; exercises the released-package install path.
#
# The editable installs live here rather than in `[tool.uv.sources]` so the
# example's pyproject.toml stays valid outside this repo — `dagster project
# from-example` copies it verbatim, and paths like ../../python_modules only
# resolve here.
commands_pre =
  source: uv pip install \
    -e ../../python_modules/libraries/dagster-dg-cli \
    -e ../../python_modules/dagster \
    -e ../../python_modules/dagster-pipes \
    -e ../../python_modules/libraries/dagster-shared \
    -e ../../python_modules/dagster-graphql \
    -e ../../python_modules/dagster-webserver \
    -e ../../python_modules/libraries/dagster-dbt \
    -e ../../python_modules/libraries/dagster-airbyte \
    -e ../../python_modules/libraries/dagster-postgres \
    -e ../../python_modules/libraries/dagster-pandas \
    -e ../../python_modules/dagster-cloud \
    -e ../../python_modules/libraries/dagster-cloud-cli
commands =
  source: /bin/bash -c '! uv pip list --exclude-editable | grep -e dagster'
  pypi: /bin/bash -c 'uv pip list --exclude-editable | grep -q "^dagster "'
  pytest -vv

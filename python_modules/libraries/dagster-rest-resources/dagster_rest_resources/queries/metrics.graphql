query GetAssetMetrics(
  $metricsFilter: AssetReportingMetricsFilter
  $metricsSelector: ReportingMetricsSelector!
  $metricsStoreType: MetricsStoreType
) {
  reportingMetricsByAsset(
    metricsFilter: $metricsFilter
    metricsSelector: $metricsSelector
    metricsStoreType: $metricsStoreType
  ) {
    __typename
    ... on ReportingMetrics {
      metrics {
        entity {
          __typename
          ... on ReportingAsset {
            assetKey {
              path
            }
            assetGroup
            codeLocationName
            repositoryName
          }
        }
        aggregateValue
        aggregateValueChange {
          change
          isNewlyAvailable
        }
        values
      }
      timestamps
    }
    ... on UnauthorizedError {
      message
    }
    ... on ReportingInputError {
      message
    }
    ... on PythonError {
      message
      stack
    }
  }
}


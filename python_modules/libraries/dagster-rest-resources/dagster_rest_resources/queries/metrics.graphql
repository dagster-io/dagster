query ListAssetMetricTypes($metricsStoreType: MetricsStoreType) {
  metricTypesForAsset(metricsStoreType: $metricsStoreType) {
    __typename
    ... on MetricTypeList {
      id
      metricTypes {
        id
        metricName
        displayName
        category
        unitType
        description
        pending
        visible
        customIcon
        costMultiplier
      }
    }
    ... on UnauthorizedError {
      message
    }
    ... on PythonError {
      message
      stack
    }
  }
}


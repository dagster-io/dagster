[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[project]
name = "dagster-parallel"
version = "1!0+dev"
description = "Discover public web sources in Dagster assets with Parallel Search."
authors = [{name = "Parallel", email = "support@parallel.ai"}]
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "dagster==1!0+dev",
    "httpx2>=2.12,<3",
    "mcp>=2.3,<3",
    "pydantic>=2",
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/dagster-io/dagster/tree/master/python_modules/libraries/dagster-parallel"

[dependency-groups]
test = [
    "dagster[test]",
    "dagster-pipes",
    "dagster-shared",
]

[tool.uv]
exclude-newer = "48h"

[tool.uv.sources]
dagster = { path = "../../dagster", editable = true }
dagster-pipes = { path = "../../dagster-pipes", editable = true }
dagster-shared = { path = "../dagster-shared", editable = true }

[alembic]
# path to migration scripts
#
# dagster-mssql ships its own revision tree rather than sharing the one in dagster core.
# That tree carries per-dialect branches whose DDL is not valid on SQL Server, and none of
# its revisions have ever been exercised against it.
script_location = dagster_mssql:alembic


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "ruff" - use the console_scripts runner, against the "ruff" entrypoint
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format --target-version=py38 --line-length=100

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

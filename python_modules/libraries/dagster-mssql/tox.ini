[tox]
requires =
    tox-uv>=1.16
skipsdist = true

[testenv]
runner = uv-venv-lock-runner
uv_sync_locked = false
uv_sync_flags = --frozen
download = True
passenv =
    CI_*
    MSSQL_TEST_*
    BUILDKITE*
    PYTEST_ADDOPTS
    PYTEST_PLUGINS
    PATH
dependency_groups =
    test
allowlist_externals =
  /bin/bash
  uv
# One factor per supported SQL Server major. `storage_tests` is 2022; the other two pick a
# different compose service via MSSQL_TEST_VERSION, which conftest.py resolves. 2017 is the
# one that matters most: it predates UTF-8 collations, which is why every text column is
# NVARCHAR rather than relying on the database codepage.
setenv =
  storage_tests_2019: MSSQL_TEST_VERSION = 2019
  storage_tests_2017: MSSQL_TEST_VERSION = 2017
commands =
  !windows: /bin/bash -c '! uv pip list --exclude-editable | grep -e dagster'

  storage_tests: pytest -vv {posargs}
  storage_tests_2019: pytest -vv {posargs}
  storage_tests_2017: pytest -vv {posargs}

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[project]
name = "dagster-mlflow"
version = "1!0+dev"
description = "Package for mlflow Dagster framework components."
authors = [{name = "Dagster Labs", email = "hello@dagsterlabs.com"}]
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "dagster==1!0+dev",
    "mlflow",
    "pandas<3.0.0",
    "protobuf!=5.29.0",
]

[project.urls]
Homepage = "https://github.com/dagster-io/dagster/tree/master/python_modules/libraries/dagster-mlflow"

[dependency-groups]
test = [
    "dagster[test]",
    "dagster-pipes",
    "dagster-shared",
]

[tool.uv]
exclude-newer = "48h"
# TEMPORARY: let mlflow 3.18.0 (published 2026-11-03, the first release that allows
# pyarrow 26) through the 48h cooldown. Remove this line after 2026-11-07.
exclude-newer-package = { mlflow = "2026-11-04T00:00:00Z", mlflow-skinny = "2026-11-04T00:00:00Z", mlflow-tracing = "2026-11-04T00:00:00Z" }
# mlflow caps cryptography by major version as a blanket policy; the cap
# would otherwise pull cryptography back to a release with an open advisory.
override-dependencies = ["cryptography>=50"]

[tool.uv.sources]
dagster = { path = "../../dagster", editable = true }
dagster-pipes = { path = "../../dagster-pipes", editable = true }
dagster-shared = { path = "../dagster-shared", editable = true }
